name: core
description: Shared core utilities, constants, and configurations for LocalGrocery apps
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Core, FCM, Crashlytics)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.5

  # Utilities
  intl: ^0.18.1
  logger: ^2.0.2+1
  equatable: ^2.0.5

  # Environment config
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
